{% extends "sysinfo-body.html" %}
{% block content-l2 %}

<h1>{{WebPageAttributes.module_name}} </h1>
<div class="table">
<table class="table table-striped table-bordered">
    <thead>
        <tr>
            <th>key</th>
            <th>value</th>
        </tr>
    </thead>
    <tbody>
        {% for key, value in WebData.sessions.items %}
            <tr>
                <td>{{ key }}</td>
                <td>{{ value }}</td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="2">Session contains nothing data.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
