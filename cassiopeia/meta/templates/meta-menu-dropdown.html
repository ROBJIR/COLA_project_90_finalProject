{% comment %}Renders the Whohas navigation menu.
Vykresluje navigační nabídku Whohas.{% endcomment %}{% load static %}

<nav class="navbar navbar-expand-lg rjd-line-menu" aria-label="Main navigation">
  <div class="container-fluid">
    <button class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-0">
        <li class="nav-item {% if not perms.meta.view_meta %}disabled{% endif %}">
          {% if not perms.meta.view_meta %} aria-disabled="true" {% endif %}
          <a class="nav-link" href="{% url 'meta' %}">home</a>
        </li>
        <li class="nav-item {% if not perms.meta.view_databases %}disabled{% endif %}">
          {% if not perms.meta.view_databases %} aria-disabled="true" {% endif %}
          <a class="nav-link" href="{% url 'databases' %}">databases</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
