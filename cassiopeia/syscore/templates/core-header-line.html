{% load static %}


<div class="row">

                {{ WebPageAttributes.application_name }}
            </a>
            <div class="d-flex align-items-center gap-3 flex-shrink-0">
                <div>
                    <a class="icon-link rjd-header-action" href="#about{{WebPageAttributes.application_code}}"

                <div>
