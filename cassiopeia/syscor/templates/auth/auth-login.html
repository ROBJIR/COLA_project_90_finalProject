{% extends "syscor-body.html" %}
{% load static %}
{% block content-l2 %}



<div class="row mt-3">
    <div class="col-12 col-lg-4">
        <div class="mt-3 p-4">

        </div>
    </div>
    <div class="col-12 col-lg-4">
        <div class="mt-3 bg-body-secondary p-4 border rounded-4">
            <h1>{{web_page_attributes.module_name}}</h1>

            <!-- web-auth-message: web-messages/web-auth-messages.html -->
            {% include "auth/auth-messages.html" %}

            <div>
                <form action="{% url 'login' %}" method="post">
                    {% csrf_token %}
                    <div class="form-floating mb-3">
                      <input type="text" class="form-control" id="username" name="username" placeholder="username">
                      <label for="username">Username</label>
                    </div>
                    <div class="form-floating mb-3">
                      <input type="password" class="form-control" id="password" name="password" placeholder="password">
                      <label for="password">Password</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100 py-3" id="login" name="login">
                            Login
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="col-12 col-lg-4">
        <div class="mt-3">

        </div>
    </div>
</div>
{% endblock %}
