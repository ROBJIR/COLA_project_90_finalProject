{% if var_name %}
<div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" role="switch" id="{{ var_name }}" {% if var_checked %} checked {% endif %} {% if not var_enabled %} disabled {% endif %}>
  <label class="form-check-label" for="{{ var_name }}">{{ var_title }}</label>
</div>
{% else %}
<p>Is not defined name for this object</p>
{% endif %}
