{% comment %}Renders the Cassiopeia navigation menu.
Vykresluje navigační nabídku Cassiopeji.{% endcomment %}{% load static %}

<nav class="navbar navbar-expand-lg rjd-line-menu" aria-label="Main navigation">
  <div class="container-fluid">
    <button class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-0">
        <li class="nav-item">
          <a class="nav-link{% if request.resolver_match.url_name == 'home' %} active{% endif %} disabled" {% if request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %} href="{% url 'home' %} ">
          containing these stars:
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link
                {% if request.resolver_match.url_name == 'whohas' %}active{% endif %}
                {% if not perms.whohas.view_whohashomepage %}disabled{% endif %}"
             href="{% url 'whohas' %}"
                {% if request.resolver_match.url_name == 'whohas' %}aria-current="page"{% endif %}
                {% if not perms.whohas.view_whohashomepage %} aria-disabled="true" {% endif %}>
              Who Has My Stuff?</a>
        </li>
        {% if not perms.paidyet.view_paidyethomepage %}
        <li class="nav-item">
          <a class="nav-link
                {% if request.resolver_match.url_name == 'paidyet' %}active{% endif %}
                {% if not perms.paidyet.view_paidyethomepage %}disabled{% endif %}"
             href="{% url 'paidyet' %}"
                {% if request.resolver_match.url_name == 'paidyet' %}aria-current="page"{% endif %}
                {% if not perms.paidyet.view_paidyethomepage %} aria-disabled="true" {% endif %}>
            Paid yet?
          </a>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
